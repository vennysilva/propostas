.topo{background:var(--dark);color:var(--on-dark);border-bottom:4px solid var(--lime);padding-top:env(safe-area-inset-top,0px)}
.topo .in{display:flex;align-items:center;gap:14px;min-height:64px;max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topo h1{font-size:18px;margin:0;line-height:1.2}
.topo .sub{font-size:13px;color:#C9D1C6}
.topo .esp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:#1A201C}
.btn.esc{background:transparent;border-color:#46524A;color:var(--on-dark)}
.btn:disabled{opacity:.55;cursor:default}
main{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
/* entrada */
.entrada{max-width:420px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.entrada h2{font-size:22px;margin:0 0 6px}
.entrada p{color:var(--mute);margin:0 0 18px}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo input{min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;letter-spacing:.04em}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:12px;color:var(--ink-2)}
.chk input{width:22px;height:22px}
.erro{color:var(--bad);font-weight:700;min-height:1.5em;margin:6px 0 0}
/* lista */
.grupo{margin:0 0 26px}
.grupo h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.card:hover{border-color:var(--green-ink)}
.card .ent{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.card h3{font-size:18px;margin:0;line-height:1.25;text-wrap:balance}
.card .res{color:var(--ink-2);font-size:15px;margin:0}
.dados{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:14px}
.dados div{min-width:0}
.dados b{display:block;font-size:12px;color:var(--mute);font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--lime-soft);color:var(--green-ink)}
.chip.aviso{background:var(--warn-soft);color:var(--warn)}
.chip.mau{background:var(--bad-soft);color:var(--bad)}
.vazio{color:var(--mute)}
.nota{font-size:13px;color:var(--mute);margin-top:30px}
/* concurso */
.vista{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5}
.vista .topo .in{min-height:56px}
.vista .topo .btn.esc{white-space:nowrap;padding:8px 12px;flex:none}
.vista .titulo{min-width:0}
.vista .titulo h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quadro{flex:1;min-height:0;position:relative}
.quadro iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.carrega{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute)}
/* assistente */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;align-items:center;gap:10px;min-height:56px;padding:12px 20px;border-radius:999px;border:0;background:var(--lime);color:#1A201C;font-weight:700;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.fab svg,.ic svg{width:22px;height:22px}
.assist{position:fixed;left:0;right:0;bottom:0;z-index:8;height:min(72vh,640px);display:flex;flex-direction:column;background:var(--card);border-top:4px solid var(--lime);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:960px){.assist{left:auto;top:0;height:auto;width:420px;border-radius:0;border-top:0;border-left:4px solid var(--lime)}
  body.assist-aberto .vista{right:424px}}
.assist .cab{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.assist .cab h2{font-size:17px;margin:0;flex:1}
.ic{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.ic[aria-pressed="true"]{background:var(--lime-soft);border-color:var(--green-ink);color:var(--green-ink)}
.conversa{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.eu{align-self:flex-end;background:var(--lime-soft);border-bottom-right-radius:4px}
.msg.ele{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.msg .acoes .btn{min-height:40px;padding:6px 12px;font-size:14px}
.msg .cit{display:block;border-left:3px solid var(--lime);padding-left:10px;margin-top:6px;color:var(--ink-2)}
.sug{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px}
.sug button{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;text-align:left}
.envio{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.envio textarea{flex:1;min-width:0;min-height:48px;max-height:120px;resize:none;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.mic.ouvir{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.estado{font-size:13px;color:var(--mute);padding:0 16px 8px;min-height:1.2em}
</style>
</head>
<body>
<header class="topo" id="topo-lista">
  <div class="in">
    <span class="logo" role="img" aria-label="4x4 Multitrabalhos"></span>
    <div><h1>Concursos</h1><div class="sub">Estudos para decidir se a 4x4 concorre</div></div>
    <span class="esp"></span>
    <button class="btn esc" id="sair" type="button" hidden>Sair</button>
  </div>
</header>

<main id="principal">
  <form class="entrada" id="entrada" autocomplete="off">
    <h2>Entrar</h2>
    <p>Escreve o código de acesso que recebeste. Maiúsculas, acentos e espaços não contam.</p>
    <div class="campo">
      <label for="codigo">Código de acesso</label>
      <input id="codigo" name="codigo" type="text" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" required>
    </div>
    <label class="chk"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button class="btn pri" type="submit" id="entrar" style="width:100%">Entrar</button>
    <p class="erro" id="erro" role="alert"></p>
  </form>
  <div id="lista" hidden></div>
</main>

<section class="vista" id="vista" hidden aria-label="Concurso">
  <header class="topo">
    <div class="in">
      <button class="btn esc" type="button" id="voltar" aria-label="Voltar aos concursos">&#8592; Concursos</button>
      <div class="titulo"><h1 id="v-titulo"></h1><div class="sub" id="v-sub"></div></div>
    </div>
  </header>
  <div class="quadro">
    <div class="carrega" id="v-carrega">A abrir o estudo…</div>
    <iframe id="v-quadro" title="Estudo do concurso"></iframe>
  </div>
</section>

<button class="fab" id="fab" type="button" hidden aria-controls="assist" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
  Perguntar
</button>

<aside class="assist" id="assist" hidden aria-label="Assistente do concurso">
  <div class="cab">
    <h2>Assistente</h2>
    <button class="ic" type="button" id="voz" aria-pressed="true" aria-label="Ler as respostas em voz alta" title="Ler as respostas em voz alta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="ic" type="button" id="fechar" aria-label="Fechar o assistente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="conversa" id="conversa" aria-live="polite"></div>
  <div class="sug" id="sug"></div>
  <div class="estado" id="estado"></div>
  <form class="envio" id="envio">
    <button class="ic mic" type="button" id="mic" aria-label="Falar" title="Falar" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    </button>
    <label class="sr" for="pergunta">Pergunta</label>
    <textarea id="pergunta" rows="1" placeholder="Escreve ou carrega no microfone"></textarea>
    <button class="btn pri" type="submit" id="enviar">Enviar</button>
  </form>
</aside>

<script>
"use strict";
const CONF = {"sal": "/S4A+AC//8nDsIwNic1fQg==", "iteracoes": 600000, "servico": null};
(() => {
  const $ = s => document.querySelector(s);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const ub64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const CHAVE_LS = "4x4c-chave-" + CONF.sal.slice(0, 8);
  let chave = null, dados = null, atual = null, conhecimento = null, urlQuadro = null;
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
               del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

  // ---------- cifra (PBKDF2-SHA256 + AES-256-GCM, conteúdo comprimido em gzip) ----------
  // maiúsculas, acentos, espaços e hífenes não contam (igual ao gerador)
  const normalizarCodigo = c => c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\s\-_.]+/g, "");
  async function derivar(codigo) {
    const base = await crypto.subtle.importKey("raw", enc.encode(normalizarCodigo(codigo)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(CONF.sal), iterations: CONF.iteracoes},
      base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
  }
  async function abrir(caminho, papel) {
    const r = await fetch(caminho, {cache: "no-cache"});
    if (!r.ok) throw new Error("ficheiro " + caminho + " indisponível (" + r.status + ")");
    const buf = new Uint8Array(await r.arrayBuffer());
    const claro = await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12), additionalData: enc.encode(papel)}, chave, buf.slice(12));
    const fluxo = new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(fluxo).text();
  }

  // ---------- entrada ----------
  async function entrar(codigo, lembrar) {
    chave = await derivar(codigo);
    dados = JSON.parse(await abrir("dados.bin", "dados"));
    if (lembrar) ls.set(CHAVE_LS, ub64(await crypto.subtle.exportKey("raw", chave)));
  }
  async function entrarGuardado() {
    const g = ls.get(CHAVE_LS); if (!g) return false;
    try {
      chave = await crypto.subtle.importKey("raw", b64(g), {name: "AES-GCM"}, true, ["decrypt"]);
      dados = JSON.parse(await abrir("dados.bin", "dados")); return true;
    } catch (e) { ls.del(CHAVE_LS); chave = null; return false; }
  }
  $("#entrada").addEventListener("submit", async ev => {
    ev.preventDefault();
    const b = $("#entrar"); b.disabled = true; $("#erro").textContent = ""; b.textContent = "A abrir…";
    try { await entrar($("#codigo").value.trim(), $("#lembrar").checked); $("#codigo").value = ""; mostrarLista(); rota(); }
    catch (e) { $("#erro").textContent = e.name === "OperationError" ? "Código errado. Tenta outra vez." : "Não foi possível abrir: " + e.message; }
    finally { b.disabled = false; b.textContent = "Entrar"; }
  });
  $("#sair").addEventListener("click", () => { ls.del(CHAVE_LS); location.hash = ""; location.reload(); });

  // ---------- lista ----------
  const DIA = 86400000;
  const hoje = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const eur = v => v == null ? "—" : new Intl.NumberFormat("pt-PT", {maximumFractionDigits: 0}).format(v) + " €";
  const dataPT = iso => { if (!iso) return "—"; const d = new Date(iso);
    return d.toLocaleDateString("pt-PT", {day: "2-digit", month: "2-digit", year: "numeric", timeZone: "Europe/Lisbon"}) +
      (iso.length > 10 ? ", " + d.toLocaleTimeString("pt-PT", {hour: "2-digit", minute: "2-digit", timeZone: "Europe/Lisbon"}) : ""); };
  function grupoDe(c) {
    const fim = c.prazo_propostas ? new Date(c.prazo_propostas) : null;
    const passou = fim && fim < new Date();
    if (!passou && c.estado === "por decidir") return "decidir";
    const entrou = new Date(c.entrou + "T00:00:00");
    if (!passou && (hoje() - entrou) / DIA < 7) return "semana";
    return "historico";
  }
  function faltam(c) {
    if (!c.prazo_propostas) return null;
    const ms = new Date(c.prazo_propostas) - new Date();
    if (ms < 0) return {txt: "prazo terminado", cls: "mau"};
    const d = Math.floor(ms / DIA);
    return d === 0 ? {txt: "entrega hoje", cls: "mau"} : {txt: "faltam " + d + (d === 1 ? " dia" : " dias") + " para entregar", cls: d <= 3 ? "aviso" : ""};
  }
  function el(tag, attrs, ...filhos) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (v == null) continue; if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
    for (const f of filhos.flat()) if (f != null) e.append(f.nodeType ? f : document.createTextNode(String(f)));
    return e;
  }
  function cartao(c) {
    const f = faltam(c);
    return el("button", {class: "card", type: "button", onclick: () => { location.hash = "c-" + c.slug; }},
      el("span", {class: "ent"}, c.entidade),
      el("h3", null, c.curto + " · " + c.titulo),
      c.resumo ? el("p", {class: "res"}, c.resumo) : null,
      el("div", {class: "dados"},
        el("div", null, el("b", null, "Preço base"), eur(c.preco_base)),
        el("div", null, el("b", null, "Entrega das propostas"), dataPT(c.prazo_propostas))),
      el("div", {class: "chips"},
        el("span", {class: "chip"}, c.estado === "por decidir" ? "À espera da tua decisão" : c.estado),
        c.parecer ? el("span", {class: "chip"}, c.parecer) : null,
        f ? el("span", {class: "chip " + f.cls}, f.txt) : null));
  }
  function mostrarLista() {
    $("#entrada").hidden = true; $("#sair").hidden = false;
    const L = $("#lista"); L.hidden = false; L.replaceChildren();
    const grupos = {decidir: [], semana: [], historico: []};
    dados.concursos.forEach(c => grupos[grupoDe(c)].push(c));
    const nomes = {decidir: "À espera da tua decisão", semana: "Esta semana", historico: "Histórico"};
    for (const k of ["decidir", "semana", "historico"]) {
      if (k !== "decidir" && !grupos[k].length) continue;
      grupos[k].sort((a, b) => String(a.prazo_propostas).localeCompare(String(b.prazo_propostas)));
      L.append(el("section", {class: "grupo"}, el("h2", null, nomes[k] + " (" + grupos[k].length + ")"),
        grupos[k].length ? el("div", {class: "cards"}, grupos[k].map(cartao)) : el("p", {class: "vazio"}, "Nenhum concurso à espera de decisão.")));
    }
    L.append(el("p", {class: "nota"}, "Estudos internos para decisão. Nada é submetido nem enviado sem autorização. Atualizado a " + dataPT(dados.gerado) + "."));
  }

  // ---------- concurso ----------
  async function abrirConcurso(slug) {
    const c = dados.concursos.find(x => x.slug === slug); if (!c) { location.hash = ""; return; }
    atual = c; conhecimento = null;
    $("#v-titulo").textContent = c.curto + " · " + c.titulo; $("#v-sub").textContent = c.entidade;
    $("#vista").hidden = false; $("#fab").hidden = false; $("#v-carrega").hidden = false; document.body.style.overflow = "hidden";
    const q = $("#v-quadro"); q.removeAttribute("src");
    novaConversa();
    try {
      const [html, k] = await Promise.all([abrir("c/" + c.slug + ".bin", "c/" + c.slug), abrir("k/" + c.slug + ".bin", "k/" + c.slug)]);
      if (atual !== c) return;
      conhecimento = JSON.parse(k); prepararIndice(); mostrarSugestoes();
      if (urlQuadro) URL.revokeObjectURL(urlQuadro);
      urlQuadro = URL.createObjectURL(new Blob([html], {type: "text/html"}));
      q.src = urlQuadro; q.onload = () => { $("#v-carrega").hidden = true; };
    } catch (e) { $("#v-carrega").textContent = "Não foi possível abrir o estudo: " + e.message; }
  }
  function fecharConcurso() {
    atual = null; $("#vista").hidden = true; $("#fab").hidden = true; fecharAssist(); document.body.style.overflow = "";
    pararVoz();
  }
  $("#voltar").addEventListener("click", () => { location.hash = ""; });
  function rota() {
    if (!dados) return;
    const h = location.hash.slice(1);
    if (h.startsWith("c-")) abrirConcurso(h.slice(2)); else fecharConcurso();
  }
  window.addEventListener("hashchange", rota);
  function irPara(secao) {
    try {
      const w = $("#v-quadro").contentWindow; if (!w) return;
      const tab = w.document.querySelector('[data-tab="' + secao + '"]');
      if (tab) tab.click(); else w.location.hash = secao;
      w.scrollTo(0, 0);
      if (window.matchMedia("(max-width: 959px)").matches) fecharAssist();
    } catch (e) {}
  }
  const tituloSecao = id => (conhecimento && (conhecimento.secoes.find(s => s.id === id) || {}).titulo) || id;

  // ---------- assistente: pesquisa nas perguntas preparadas e no estudo ----------
  const PARAGEM = new Set("a o as os um uma uns umas de do da dos das em no na nos nas num numa por pelo pela pelos pelas para pra com e ou que se me te lhe nos vos isto isso aquilo este esta estes estas esse essa esses essas ao aos à às é e são ser foi era ha há tem temos ter tenho mais muito muita ja já ainda tambem também so só sobre entre ate até eu tu ele ela nos nós voces vocês eles elas meu minha teu tua seu sua dizer diz diz-me sabes saber queria quero podes pode poderia favor la lá ai aí aqui entao então bem pois tipo coisa coisas qual quais quem isto e afinal agora preciso precisas precisa precisamos precisos precisam necessario necessaria necessarios necessarias tomar podemos posso pode poderemos dar fica ficam estar esta estao sao vou vamos".split(" "));
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const raiz = t => t.length > 5 ? t.slice(0, 5) : t;
  // palavras diferentes que o Luís pode usar para a mesma coisa
  const SINONIMOS = {};
  [["alvara", "alvaras", "licenca", "licencas", "alvara"], ["documentos", "papeis", "papelada", "documentacao", "documentos"],
   ["caucao", "garantia", "garantias", "caucao"], ["equipa", "equipas", "homens", "pessoas", "trabalhadores", "pessoal", "equipa"],
   ["decidir", "decisao", "decisoes", "decido", "decide", "decidir"], ["multa", "multas", "penalizacoes", "penalizacao", "penalidades", "sancoes", "multa"],
   ["pontuacao", "pontos", "pontua", "pontuar", "pontuacao"], ["pagar", "pagam", "paga", "pagamento", "pagamentos", "pagos", "pagar"],
   ["prazo", "prazos", "dia", "data", "datas", "prazo"], ["minimo", "baixo", "barato", "minima", "minimo"], ["valor", "vale", "montante", "valor"],
   ["entidade", "empresa", "cliente", "dono", "entidade"], ["recomendacao", "recomendam", "recomendas", "aconselhas", "conselho", "recomendacao"],
   ["riscos", "risco", "perigos", "perigo", "riscos"], ["desenhos", "plantas", "planta", "desenho", "cortes", "desenhos"]]
    .forEach(g => { const alvo = g[g.length - 1]; g.forEach(p => { SINONIMOS[p] = alvo; }); });
  const fichas = s => norm(s).split(" ").filter(t => t && !PARAGEM.has(t)).map(t => raiz(SINONIMOS[t] || t));
  let indice = null;
  function prepararIndice() {
    const df = new Map(); const docs = [];
    const addDoc = ts => { new Set(ts).forEach(t => df.set(t, (df.get(t) || 0) + 1)); };
    const faq = (conhecimento.faq || []).map(p => ({p, formas: p.formas.map(fichas), chaves: new Set((p.palavras || []).flatMap(fichas))}));
    faq.forEach(f => f.formas.forEach(addDoc));
    const frases = [];
    conhecimento.secoes.forEach(s => s.texto.split(/\n+|(?<=[.;:!?])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ«0-9])/).forEach(fr => {
      const t = fr.trim(); if (t.length < 25 || t.length > 600) return; const ts = fichas(t); if (ts.length < 3) return; frases.push({secao: s.id, texto: t, ts: new Set(ts)}); addDoc(ts); }));
    const N = faq.reduce((n, f) => n + f.formas.length, 0) + frases.length;
    const idf = t => Math.log(1 + N / (1 + (df.get(t) || 0)));
    indice = {faq, frases, idf};
  }
  function procurar(texto) {
    const q = [...new Set(fichas(texto))]; if (!q.length) return null;
    const {faq, frases, idf} = indice; const pq = q.reduce((s, t) => s + idf(t), 0);
    let melhor = null;
    for (const f of faq) {
      let m = 0, cobMax = 0;
      for (const fs of f.formas) {
        const set = new Set(fs); const comum = q.filter(t => set.has(t)).reduce((s, t) => s + idf(t), 0);
        const pf = [...set].reduce((s, t) => s + idf(t), 0); if (!comum) continue;
        const cob = comum / pq, pre = comum / pf; m = Math.max(m, 2 * cob * pre / (cob + pre)); cobMax = Math.max(cobMax, cob);
      }
      const ch = q.filter(t => f.chaves.has(t)).reduce((s, t) => s + idf(t), 0) / pq;
      const cob = Math.max(cobMax, ch);
      const nota = m + 0.25 * ch;
      if (!melhor || nota > melhor.nota) melhor = {nota, cob, p: f.p};
    }
    // só se aceita uma resposta preparada se as palavras com peso da pergunta estiverem lá (pelo menos metade)
    if (melhor && melhor.nota >= 0.42 && melhor.cob >= 0.45) return {tipo: "faq", ...melhor};
    let frase = null;
    for (const fr of frases) {
      const comum = q.filter(t => fr.ts.has(t)).reduce((s, t) => s + idf(t), 0) / pq;
      if (!frase || comum > frase.nota) frase = {nota: comum, fr};
    }
    if (frase && frase.nota >= 0.6) return {tipo: "estudo", ...frase};
    if (melhor && melhor.nota >= 0.3 && melhor.cob >= 0.45) return {tipo: "faq", ...melhor, fraca: true};
    return null;
  }
  window.__assistente = {procurar: t => { const r = procurar(t); return r && (r.tipo === "faq" ? {tipo: r.tipo, id: r.p.id, fraca: !!r.fraca} : {tipo: r.tipo, secao: r.fr.secao}); }, ehPedido: t => ehPedido(t)};
  const PEDIDO = /\b(muda|mudar|mude|altera|alterar|altere|corrige|corrigir|acrescenta|acrescentar|tira|tirar|retira|refaz|refazer|prepara|preparar|envia|enviar|manda|mandar|pede|pedir|submete|submeter|marca|marcar|liga|ligar|avisa|avisar|actualiza|atualiza|atualizar|faz isso|fazer isso|quero que|preciso que|diz ao ruben|pede ao ruben|vamos concorrer|nao vamos concorrer|concorremos sim|nao concorremos|avanca|avancem|avancar|aprovo|aprovado)\b/;
  const ehPedido = t => PEDIDO.test(norm(t));

  // ---------- assistente: interface ----------
  let conversa = [];
  function novaConversa() {
    conversa = []; $("#conversa").replaceChildren(); $("#estado").textContent = ""; $("#sug").hidden = false;
    dizer("Olá, Luís. Pergunta-me o que quiseres sobre este concurso, por voz ou por escrito. Se quiseres alterar alguma coisa ou dar uma decisão, eu passo o pedido ao Ruben.", {semVoz: true});
  }
  function mostrarSugestoes() {
    const S = $("#sug"); S.replaceChildren();
    (conhecimento.faq || []).slice(0, 4).forEach(p => S.append(el("button", {type: "button", onclick: () => perguntar(p.formas[0])}, p.formas[0])));
  }
  function bolha(quem, conteudo) {
    const m = el("div", {class: "msg " + quem}, conteudo); $("#conversa").append(m);
    m.scrollIntoView({block: "end", behavior: "smooth"}); return m;
  }
  function dizer(texto, op = {}) {
    const m = bolha("ele", texto);
    if (op.citacao) m.append(el("span", {class: "cit"}, "«" + op.citacao + "»"));
    const acoes = el("div", {class: "acoes"});
    if (op.secao) acoes.append(el("button", {class: "btn", type: "button", onclick: () => irPara(op.secao)}, "Ver no estudo: " + tituloSecao(op.secao)));
    if (op.pedido) acoes.append(el("button", {class: "btn pri", type: "button", onclick: ev => passarAoRuben(op.pedido, ev.currentTarget)}, "Passar ao Ruben"));
    if (acoes.childNodes.length) m.append(acoes);
    conversa.push({papel: "assistente", texto: texto + (op.citacao ? " «" + op.citacao + "»" : "")});
    if (!op.semVoz) falar(op.falar || texto);
    return m;
  }
  async function perguntar(texto) {
    texto = texto.trim(); if (!texto || !conhecimento) return;
    bolha("eu", texto); conversa.push({papel: "luis", texto}); $("#sug").hidden = true;
    $("#pergunta").value = ""; ajustar();
    if (CONF.servico) {
      $("#estado").textContent = "A pensar…";
      try { const r = await servico("perguntar", {concurso: resumoConcurso(), secoes: conhecimento.secoes, pergunta: texto, historico: conversa.slice(-9, -1)});
        $("#estado").textContent = "";
        if (r && r.resposta) { dizer(r.resposta, {secao: r.secao || null, pedido: r.tipo === "pedido" ? (r.resumo_pedido || texto) : null}); return; }
      } catch (e) { $("#estado").textContent = "Sem ligação ao serviço; respondo com o que está no estudo."; }
    }
    responderLocal(texto);
  }
  function responderLocal(texto) {
    if (ehPedido(texto)) { dizer("Isto é um pedido para o Ruben. Queres que lho passe?", {pedido: texto}); return; }
    const r = procurar(texto);
    if (!r) { dizer("Não encontro isso no estudo. Queres que passe a pergunta ao Ruben?", {pedido: texto}); return; }
    if (r.tipo === "faq") {
      dizer(r.p.resposta + (r.fraca ? "\n\nSe não era isto, posso passar a pergunta ao Ruben." : ""), {secao: r.p.secao, pedido: r.fraca ? texto : null, falar: r.p.resposta}); return; }
    dizer("No estudo, em «" + tituloSecao(r.fr.secao) + "», está isto:", {citacao: r.fr.texto, secao: r.fr.secao, pedido: texto, falar: r.fr.texto});
  }
  const resumoConcurso = () => ({id: atual.id, curto: atual.curto, titulo: atual.titulo, entidade: atual.entidade, referencia: atual.referencia});
  async function servico(rotaS, corpo) {
    const r = await fetch(CONF.servico.replace(/\/$/, "") + "/" + rotaS, {method: "POST",
      headers: {"content-type": "application/json", "x-acesso": dados.acesso}, body: JSON.stringify(corpo)});
    if (!r.ok) throw new Error("serviço " + r.status); return r.json();
  }
  async function passarAoRuben(texto, botao) {
    if (botao) botao.disabled = true;
    const ultimas = conversa.slice(-6).map(m => (m.papel === "luis" ? "Luís: " : "Assistente: ") + m.texto).join("\n");
    if (CONF.servico) {
      try { const r = await servico("pedido", {concurso: resumoConcurso(), texto, conversa: ultimas});
        if (r && r.ok) { dizer("Pronto, o pedido ficou registado para o Ruben" + (r.numero ? " (pedido n.º " + r.numero + ")" : "") + ". Ele é avisado por email."); return; }
      } catch (e) {}
    }
    const assunto = "Pedido do Luís · " + atual.curto;
    const corpo = "Concurso: " + atual.titulo + " (" + atual.referencia + ")\n\nPedido do Luís:\n" + texto + "\n\nConversa com o assistente:\n" + ultimas + "\n\nEnviado a partir da página dos concursos.";
    location.href = "mailto:" + encodeURIComponent(dados.ruben_email) + "?subject=" + encodeURIComponent(assunto) + "&body=" + encodeURIComponent(corpo);
    dizer("Abri um email para o Ruben com o pedido já escrito. Só tens de carregar em Enviar.");
  }
  function abrirAssist() { document.body.classList.add("assist-aberto"); $("#assist").hidden = false; $("#fab").hidden = true; $("#fab").setAttribute("aria-expanded", "true"); setTimeout(() => $("#pergunta").focus({preventScroll: true}), 50); }
  function fecharAssist() { document.body.classList.remove("assist-aberto"); $("#assist").hidden = true; if (atual) $("#fab").hidden = false; $("#fab").setAttribute("aria-expanded", "false"); pararOuvir(); }
  $("#fab").addEventListener("click", abrirAssist);
  $("#fechar").addEventListener("click", fecharAssist);
  $("#envio").addEventListener("submit", ev => { ev.preventDefault(); perguntar($("#pergunta").value); });
  const ajustar = () => { const t = $("#pergunta"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; };
  $("#pergunta").addEventListener("input", ajustar);
  $("#pergunta").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); perguntar($("#pergunta").value); } });

  // ---------- voz: falar (síntese) e ouvir (reconhecimento) ----------
  let vozLigada = ls.get("4x4c-voz") !== "0", vozPT = null;
  const escolherVoz = () => { const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    vozPT = vs.find(v => /^pt[-_]PT/i.test(v.lang)) || null; };
  if (window.speechSynthesis) { escolherVoz(); speechSynthesis.addEventListener("voiceschanged", escolherVoz); }
  function falar(texto) {
    if (!vozLigada || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto.replace(/«|»/g, "")); u.lang = "pt-PT"; if (vozPT) u.voice = vozPT; u.rate = 1.0;
    speechSynthesis.speak(u);
  }
  function pararVoz() { if (window.speechSynthesis) speechSynthesis.cancel(); }
  const bVoz = $("#voz");
  const pintarVoz = () => { bVoz.setAttribute("aria-pressed", String(vozLigada)); bVoz.title = vozLigada ? "Voz ligada" : "Voz desligada"; };
  pintarVoz();
  bVoz.addEventListener("click", () => { vozLigada = !vozLigada; ls.set("4x4c-voz", vozLigada ? "1" : "0"); pintarVoz(); if (!vozLigada) pararVoz(); });
  const Reconhecer = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, aOuvir = false;
  if (Reconhecer) {
    $("#mic").hidden = false;
    $("#mic").addEventListener("click", () => { aOuvir ? pararOuvir() : ouvir(); });
  }
  function ouvir() {
    pararVoz();
    rec = new Reconhecer(); rec.lang = "pt-PT"; rec.interimResults = true; rec.maxAlternatives = 1;
    let final = "";
    rec.onresult = ev => { let prov = ""; for (const r of ev.results) { if (r.isFinal) final = r[0].transcript; else prov += r[0].transcript; } $("#pergunta").value = final || prov; ajustar(); };
    rec.onerror = ev => { $("#estado").textContent = ev.error === "not-allowed" ? "O microfone não está autorizado neste navegador." : "Não percebi. Tenta outra vez."; };
    rec.onend = () => { aOuvir = false; $("#mic").classList.remove("ouvir"); $("#mic").setAttribute("aria-label", "Falar");
      if ($("#estado").textContent === "A ouvir…") $("#estado").textContent = ""; if (final.trim()) perguntar(final); };
    try { rec.start(); aOuvir = true; $("#mic").classList.add("ouvir"); $("#mic").setAttribute("aria-label", "Parar de ouvir"); $("#estado").textContent = "A ouvir…"; }
    catch (e) { $("#estado").textContent = "Não foi possível usar o microfone."; }
  }
  function pararOuvir() { if (rec && aOuvir) try { rec.stop(); } catch (e) {} }

  // ---------- arranque ----------
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    $("#erro").textContent = "Este navegador é antigo demais para abrir a página. Usa o Chrome atualizado.";
    $("#entrar").disabled = true; return;
  }
  entrarGuardado().then(ok => { if (ok) { mostrarLista(); rota(); } else $("#codigo").focus(); });
})();
</script>
