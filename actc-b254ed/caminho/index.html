<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Mapa mental e caminho do Grupo ACTC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#0f1419;--ink2:#1a222b;--ink3:#2a3541;--paper:#f2f4f4;--white:#fff;--fog:#a9b4be;--amber:#e3a72f;--line:#3a4653}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--ink);color:var(--white);
font:16px/1.55 "Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"01  Como o grupo funciona\A 02  Caminho para a ação\A 03  Identidade visual";white-space:pre;display:flex;align-items:flex-end;padding:0 0 64px 64px;font:700 clamp(1.6rem,2.9vw,2.6rem)/1.45 "Archivo",sans-serif;color:var(--white);letter-spacing:-.005em;grid-column:1;grid-row:1;background:
linear-gradient(var(--ink3) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--ink3) 1px,transparent 1px) 0 0/48px 48px,var(--ink2);
border-right:1px solid var(--line);
box-shadow:inset 0 -6px 0 var(--amber)}
main{grid-column:2;grid-row:1;align-self:center;width:min(100%,440px);margin:0 auto;
padding:48px max(24px,env(safe-area-inset-right,0px)) 48px max(24px,env(safe-area-inset-left,0px))}
main::before{content:"ACTC";display:block;font:800 1.05rem/1 "Archivo",sans-serif;letter-spacing:.14em;color:var(--white);
border-left:4px solid var(--amber);padding:.35rem 0 .35rem .7rem;margin-bottom:2.6rem}
h1{font:700 clamp(1.9rem,3.2vw,2.6rem)/1.08 "Archivo",sans-serif;letter-spacing:-.01em;margin:0 0 .7rem}
p{color:var(--fog);margin:0 0 2rem}
label{display:block;font:500 .78rem/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.04em;color:var(--fog);margin-bottom:.55rem}
input{width:100%;font:inherit;padding:.85rem 1rem;border:1px solid var(--line);background:var(--ink2);color:var(--white);border-radius:0;min-height:50px}
input:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber)}
button{margin-top:1rem;width:100%;min-height:50px;font:700 1rem/1 "Archivo",sans-serif;background:var(--amber);color:var(--ink);border:0;border-radius:0;cursor:pointer}
button:hover{filter:brightness(1.06)}
#erro{color:var(--amber);min-height:1.5em;margin-top:.8rem}
small{display:block;margin-top:2.6rem;color:var(--fog);font:400 .78rem/1.4 "IBM Plex Mono",ui-monospace,monospace}
.cx{display:flex;gap:8px}.cx input{flex:1;min-width:0}
#ver{margin:0;width:auto;padding:0 1.1rem;background:transparent;color:var(--white);border:1px solid var(--line);font-weight:500}
@media (max-width:760px){body{grid-template-columns:1fr}body::before{display:none}main{grid-column:1;padding-top:56px}}
</style></head><body><main>
<h1>Mapa mental e caminho do Grupo ACTC</h1><p>Página reservada. Escreva a palavra-passe que recebeu.</p>
<form id="f"><label for="c">Palavra-passe</label><div class="cx"><input id="c" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required><button type="button" id="ver" aria-pressed="false">Mostrar</button></div>
<button type="submit">Abrir</button><div id="erro" role="alert"></div></form>
<small>Bússola Compatível · para o Grupo ACTC</small></main>
<script>
const CONF={"sal": "XXcn371J+IAa5WClTqyR8Q==", "iteracoes": 600000, "grupo": "pg-0eb0b728c39f853a"};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById('f'),erro=document.getElementById('erro');
async function abrir(codigo){
const dados=new Uint8Array(await (await fetch('dados.bin',{cache:'no-store'})).arrayBuffer());
let cf=CONF;try{const r=await fetch('conf.json',{cache:'no-store'});if(r.ok)cf=await r.json();}catch(x){}
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(codigo),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(cf.sal),iterations:cf.iteracoes},base,{name:'AES-GCM',length:256},false,['decrypt']);
const z=await crypto.subtle.decrypt({name:'AES-GCM',iv:dados.slice(0,12),additionalData:new TextEncoder().encode('pagina')},k,dados.slice(12));
const txt=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
if(CONF.grupo){try{sessionStorage.setItem(CONF.grupo,codigo);}catch(x){}}
document.open();document.write(txt);document.close();}
f.addEventListener('submit',async e=>{e.preventDefault();erro.textContent='A abrir…';
try{await abrir(document.getElementById('c').value.trim());}catch(x){erro.textContent='Palavra-passe errada. Tente de novo.';}});
document.getElementById('ver').addEventListener('click',e=>{const c=document.getElementById('c'),v=c.type==='password';c.type=v?'text':'password';e.currentTarget.textContent=v?'Esconder':'Mostrar';e.currentTarget.setAttribute('aria-pressed',v);});
(async()=>{if(!CONF.grupo)return;let g=null;try{g=sessionStorage.getItem(CONF.grupo);}catch(x){}
if(!g)return;f.hidden=true;erro.textContent='A abrir…';
try{await abrir(g);}catch(x){try{sessionStorage.removeItem(CONF.grupo);}catch(y){}f.hidden=false;erro.textContent='';}})();
</script></body></html>
